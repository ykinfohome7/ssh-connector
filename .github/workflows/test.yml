name: connection-test
on:
  push:
    branches: [main]
    paths-ignore:
      - "control/**"
      - "test-results.txt"
  pull_request:
    branches: [main]
  workflow_dispatch:

# Do not cancel a PR check when an unrelated main commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI must never publish test credentials or modify the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test requirements
        run: python -m pip install -r requirements.txt
      - name: Check SSH profile management
        run: python tests/test_profiles.py
      - name: Check Claude Code and Codex plugins (v1.3.0, 44 tools)
        run: python tests/test_plugins.py
      - name: Verify SSH, MCP and installation integration
        shell: bash
        run: |
          # The network test logs may contain ephemeral authentication URLs.
          # Keep them only on this disposable runner; do not upload or commit.
          if python tests/test_connect.py > "$RUNNER_TEMP/connection-test.log" 2>&1; then
            echo "SSH/MCP/integration tests passed."
          else
            echo "::error::SSH/MCP/integration tests failed. Detailed logs are withheld to prevent credential exposure."
            exit 1
          fi
