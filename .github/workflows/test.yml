name: connection-test
on:
  push:
    branches: [main]
    paths-ignore:
      - "control/**"
      - "test-results.txt"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This is a PUBLIC repository. Only allowlisted summaries may be uploaded.
# Never print/upload raw SSH logs, tokens, credentials, or tunnel URLs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check connector and DDNS boot syntax
        run: |
          bash -n scripts/gh-session.sh
          bash -n scripts/cloudns-ddns.sh
          bash -n scripts/setup-bgssh-domain.sh
          bash -n install-server.sh
          # Both public and local installers must not add root SSH authorization.
          ! grep -q 'cat.*id_ed25519.pub.*>> /root/.ssh/authorized_keys' install-server.sh
          # GitHub Actions must not fall back to ephemeral quick tunnels.
          ! grep -Eq 'cloudflared tunnel|start_cloudflare' scripts/gh-session.sh
      - name: Test ClouDNS DDNS safety (offline, no DNS calls)
        run: python3 tests/test_cloudns_ddns.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test requirements
        run: python -m pip install -r requirements.txt
      - name: Check SSH profile management
        id: profiles
        run: python tests/test_profiles.py
      - name: Check Codespaces lifecycle tools (offline, no GitHub calls)
        run: python tests/test_codespaces.py
      - name: Check Claude Code and Codex plugins (v1.3.3, 48 tools)
        id: plugins
        run: python tests/test_plugins.py
      - name: Check public log redaction and schema
        run: python tests/test_ci_summary.py
      - name: Verify SSH, MCP and installation integration
        id: integration
        shell: bash
        env:
          SSH_CONNECTOR_CI_REPORT: ${{ runner.temp }}/ssh-ci-report/integration.json
        run: |
          # Raw output is ephemeral on this runner and NEVER uploaded or committed.
          mkdir -p "$RUNNER_TEMP/ssh-ci-report"
          if python tests/test_connect.py > "$RUNNER_TEMP/ssh-raw-connection.log" 2>&1; then
            echo "SSH/MCP/integration tests passed."
          else
            echo "::error::Integration failed. Read the sanitized Actions summary/artifact."
            exit 1
          fi
      - name: Generate safe diagnostic logs
        if: always()
        env:
          SSH_CI_REPORT_DIR: ${{ runner.temp }}/ssh-ci-report
          SSH_CONNECTOR_CI_REPORT: ${{ runner.temp }}/ssh-ci-report/integration.json
          SSH_CI_PROFILE_OUTCOME: ${{ steps.profiles.outcome }}
          SSH_CI_PLUGIN_OUTCOME: ${{ steps.plugins.outcome }}
          SSH_CI_INTEGRATION_OUTCOME: ${{ steps.integration.outcome }}
        run: python scripts/ci_summary.py
      - name: Attach sanitized test logs (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssh-connector-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ssh-ci-report/summary.json
            ${{ runner.temp }}/ssh-ci-report/summary.md
          retention-days: 7
          if-no-files-found: warn
