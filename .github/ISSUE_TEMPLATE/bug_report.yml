name: "🐞 Има грешка / Bug report"
description: "Нещо не работи / Something does not work"
title: "[Грешка] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "⚠️ **Не поставяй пароли, токени, ключове или IP адреси. / Never paste passwords, tokens, keys or IP addresses.**"
  - type: input
    id: version
    attributes:
      label: "Версия / Version"
      description: "От / from `version_info`"
      placeholder: "1.3.2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "Какво се случи? / What happened?"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Какво очакваше? / What did you expect?"
  - type: textarea
    id: steps
    attributes:
      label: "Стъпки / Steps to reproduce"
      placeholder: "1. ...\n2. ..."
  - type: dropdown
    id: client
    attributes:
      label: "Къде? / Where?"
      multiple: true
      options: ["Claude Code", "Claude app", "ChatGPT", "Codex", "GitHub Actions session", "Always-on server", "Other / Друго"]
